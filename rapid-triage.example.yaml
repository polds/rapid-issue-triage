# Rapid Triage configuration. Copy to ./rapid-triage.yaml or
# ~/.config/rapid-triage/config.yaml. Every field is optional.
# API keys (Linear, GitHub, Datadog) and the Claude binary path can also be
# set in the Settings page; those persist in the local sqlite db.

# Listen address for the local web UI.
addr: 127.0.0.1:7333

# Where the sqlite index lives.
db_path: ~/.rapid-triage/triage.db

# Which issues count as "untriaged". This is a raw Linear GraphQL IssueFilter,
# passed through verbatim — anything Linear supports works.
# Docs: https://developers.linear.app/docs/graphql/filtering
#
# Default: everything in a Triage- or Backlog-type workflow state.
filter:
  state:
    type:
      in: [triage, backlog]

# Example: backlog issues missing your "triaged" label:
# filter:
#   state:
#     type:
#       eq: backlog
#   labels:
#     every:
#       name:
#         neq: "infra:triaged"

sync:
  interval: 10m   # background refresh cadence; UI serves stale data while syncing
  page_size: 50

ai:
  enabled: true   # shells out to Claude Code (no API key needed)
  command: claude
  model: ""       # optional --model override
  timeout: 3m
  prefetch: 0     # enrich up to N upcoming queue items in the background

# Periodic "is there a newer release?" check. This is the only outbound request
# the app makes that is not to Linear or to your local claude binary: one
# unauthenticated GET to GitHub's public releases endpoint. Nothing about your
# workspace is sent. Set enabled: false and nothing leaves the machine.
update_check:
  enabled: true
  interval: 24h   # floored at 1h
  repo: polds/rapid-issue-triage
