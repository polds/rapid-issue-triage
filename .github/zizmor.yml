# zizmor audit configuration. Every entry here is a deliberate, reviewed
# exception — the default is that a finding gets fixed, not listed.
rules:
  cache-poisoning:
    ignore:
      # zizmor flags actions/setup-node in any tag-triggered workflow purely
      # because the workflow publishes artifacts, regardless of the cache
      # input. Caching is explicitly disabled on both setup-go and setup-node
      # in the release job, so there is no cache entry for a PR branch to
      # poison. Node cannot be dropped: .goreleaser.yaml's before-hooks run
      # `npm ci` and `npm run build` to produce the embedded UI.
      - release.yml
