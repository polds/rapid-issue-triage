version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Conventional Commits: the scope names the area of the repo the bump touches.
    # `build` is the Conventional Commits type for build-system / dependency changes.
    commit-message:
      prefix: "build(backend)"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(frontend)"
      # npm distinguishes devDependencies; those are tooling, not shipped code.
      prefix-development: "chore(frontend)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
  # The Dockerfile's pinned base image. Held from auto-merge (see
  # dependabot-auto-merge.yml): no pull request builds the container image, so
  # a bump is unvalidated until a release runs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(docker)"
