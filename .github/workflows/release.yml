name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "v*.*.* tag to publish. Leave empty for a snapshot dry run (builds and packages, publishes nothing)."
        required: false
        type: string
      create_tag:
        description: "Create the tag above at the dispatched ref first, then release it. Leave unchecked if the tag already exists."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    env:
      # Non-empty only when this run should publish a GitHub Release: a v* tag
      # push, or a manual run that named an existing tag. A manual run with no
      # tag leaves this empty and stays a snapshot dry run.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      # True only for a manual run that asked to mint the tag itself. The tag is
      # created and released in this same job, so nothing depends on a tag push
      # re-triggering the workflow (a GITHUB_TOKEN push would not).
      CREATE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag && inputs.tag != '' }}
    steps:
      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        run: |
          # Stricter than the v*.*.* trigger glob on purpose: this job can now
          # mint the tag, and GoReleaser only rejects a non-semver tag after it
          # has already been pushed, which would leave a junk tag behind.
          if ! printf '%s' "$RELEASE_TAG" |
            grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::RELEASE_TAG '$RELEASE_TAG' is not a semver v*.*.* tag"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Publishing an existing tag checks out that tag so GoReleaser sees it
          # as the current version. When minting the tag we stay on the
          # dispatched ref, since the tag does not exist yet; dry runs too.
          ref: ${{ env.CREATE_TAG == 'true' && github.ref || env.RELEASE_TAG || github.ref }}
          fetch-depth: 0
          # Do not leave the job token in .git/config. GoReleaser authenticates
          # over the API with GITHUB_TOKEN, and the tag push below uses an
          # explicit credential, so nothing here needs a persisted one.
          persist-credentials: false

      - name: Create and push tag
        if: env.CREATE_TAG == 'true'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists. Re-run with 'create_tag' unchecked to publish it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproducible timestamps
        run: |
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)"
            echo "TZ=UTC"
            echo "LANG=C"
          } >> "$GITHUB_ENV"

      # Caching is deliberately off in the release path: a cache entry poisoned
      # from any branch would otherwise land inside signed, attested artifacts.
      # CI keeps its caches; releases are rare enough to pay for a cold build.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false

      # zizmor flags any setup-node in a tag-triggered workflow regardless of
      # the cache input. Caching is off here (empty string is setup-node's
      # explicit "no cache" value), so there is no cache to poison. Node is
      # required: .goreleaser.yaml's before-hooks run `npm ci` + `npm run build`.
      # Suppressed in .github/zizmor.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ""

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ env.RELEASE_TAG != '' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      - name: Attest build provenance
        if: env.RELEASE_TAG != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # SBOMs are published as release assets by GoReleaser itself (they are
      # first-class SBOM artifacts, not extra_files); provenance covers every
      # checksums.txt subject (archives, packages, source, SBOMs).

      - name: Upload snapshot artifacts
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.spdx.json
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7
