name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only where they must.
permissions:
  contents: read

jobs:
  go:
    name: Go fmt, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # These call the same make targets a contributor runs via `make ci`, so
      # local and CI cannot drift apart. The targets also filter out
      # web/node_modules, which ships Go sources of its own.
      - name: gofmt
        run: make fmt-check
      - name: go fix
        run: make fix-check
      - name: go vet
        run: make vet
      # -race catches the data races a single-threaded run hides; this server
      # fans enrichment out across goroutines.
      - name: go test (race)
        run: make test-race
      - name: coverage floor
        run: make cover-go

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Read the pin from the Makefile rather than repeating it: `make lint`
      # and this job must run the same golangci-lint, and a second copy of the
      # version here is a copy that can go stale.
      - name: Resolve pinned golangci-lint version
        id: pin
        run: echo "version=$(make -s print-GOLANGCI_LINT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.pin.outputs.version }}

  actions:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # zizmor is the security-focused counterpart to actionlint: it finds
      # template injection, credential persistence, cache poisoning and
      # over-broad permissions that actionlint does not model. Installed here
      # so `make actions-lint` finds it; that target fails rather than skips
      # when zizmor is missing and CI is set.
      # Version comes from the Makefile for the same reason as golangci-lint
      # above: `make actions-lint` names the pin in its skip message, and the
      # two must not drift.
      - name: Install zizmor
        run: |
          python -m pip install --disable-pip-version-check \
            "zizmor==$(make -s print-ZIZMOR_VERSION)"
      # actionlint validates workflow syntax, expressions, and `runs-on`
      # labels, and shellchecks every `run:` block. Built from source at a
      # pinned tag rather than curl|sh from a release. Same make target a
      # contributor runs, so CI and the pre-commit hook cannot drift.
      - name: actionlint + zizmor
        run: make actions-lint

  web:
    name: Web lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      # Coverage floor is scoped to the pure logic modules, mirroring how
      # cover-go scopes the Go floor to internal/config + internal/store.
      - name: vitest
        run: npm run coverage
      - run: npm run build
      # web/dist is tracked because webui.go embeds it: `go install`-ing this
      # module has to compile without anyone running npm. Nothing else notices
      # when the committed bundle drifts from web/src - this job builds into an
      # artifact and never reads the committed copy, and the binary the release
      # ships would keep serving whatever UI was committed last.
      - name: Verify committed web/dist matches the build
        run: |
          # Only the worktree column matters, matching `make web-dist-check`:
          # a rebuilt bundle that is already staged is not drift.
          drift=$(git status --porcelain -- dist | awk 'substr($0,2,1) != " "')
          if [ -n "$drift" ]; then
            {
              echo "web/dist does not match a build of web/src:"
              echo "$drift"
              echo "Run 'make web-build' and commit web/dist with your change."
            } >&2
            exit 1
          fi
          echo "web/dist matches a fresh build"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  build:
    name: Embed UI and compile binary
    needs: [web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
          - os: macos-latest
            ext: ""
          - os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: go build
        run: go build -trimpath -o triage${{ matrix.ext }} ./cmd/triage
      - name: binary version
        run: ./triage${{ matrix.ext }} -version
      - name: binary help
        run: ./triage${{ matrix.ext }} -h

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Pinned, not @latest: a scanner that silently changes version between
      # runs makes a red build unreproducible and is itself a supply-chain
      # dependency. The pin lives in the Makefile (GOVULNCHECK_VERSION) and is
      # bumped by hand -- Dependabot only tracks `uses:` refs, not a version
      # a make target passes to `go run`.
      - name: govulncheck
        run: make vuln
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    # Blocks a PR that introduces a dependency with a known vulnerability or a
    # disallowed license, before it ever reaches main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
